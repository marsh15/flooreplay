# API only. Deploy frontend/ on Vercel; use external Neon PostgreSQL.
services:
  - type: web
    name: flooreplay-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv==0.10.4 && uv sync --frozen --no-dev
    startCommand: >-
      sh -c 'export FLOORREPLAY_BUILD_ID="$RENDER_GIT_COMMIT";
      uv run --no-dev alembic upgrade head &&
      uv run --no-dev python -m flooreplay seed &&
      exec uv run --no-dev uvicorn flooreplay.api:app --host 0.0.0.0 --port "$PORT"'
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.10'
      - key: FLOORREPLAY_MODE
        value: public
      - key: FLOORREPLAY_DATABASE_URL
        sync: false
      - key: FLOORREPLAY_OPENAI_API_KEY
        sync: false
      - key: FLOORREPLAY_CORS_ORIGINS
        sync: false
      - key: FLOORREPLAY_OPENAI_GENERATION_MODEL
        value: gpt-4.1-mini-2025-04-14
      - key: FLOORREPLAY_OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: FLOORREPLAY_OPENAI_EMBEDDING_DIMENSIONS
        value: '512'
