<text x="60" y="80.0" fill="#343b45" font-family="Chalkboard, Comic Sans MS, cursive" font-size="38">FloorReplay architecture</text>
<text x="60" y="119.0" fill="#5d6470" font-family="Chalkboard, Comic Sans MS, cursive" font-size="21">Evidence stays versioned. Reports keep their original cutoff and inputs.</text>
