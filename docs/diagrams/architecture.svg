<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850" role="img" aria-labelledby="title description">
<title id="title">FloorReplay architecture</title>
<desc id="description">The React browser calls FastAPI. Authentication and workspace scope guard backend investigation modules, which persist evidence and workflow in PostgreSQL. Optional OpenAI calls use server-side keys and a reserved allowance. The modules run inside the API process.</desc>
<rect width="1360" height="850" fill="#fcfaf5"/>
