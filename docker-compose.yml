services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flooreplay
      POSTGRES_PASSWORD: ${FLOORREPLAY_DB_PASSWORD:-local-compose-only}
      POSTGRES_DB: flooreplay
    ports:
      - "127.0.0.1:${FLOORREPLAY_DB_PORT:-5434}:5432"
    volumes:
      - flooreplay-release-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flooreplay -d flooreplay"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      FLOORREPLAY_DATABASE_URL: postgresql+psycopg://flooreplay:${FLOORREPLAY_DB_PASSWORD:-local-compose-only}@db:5432/flooreplay
      FLOORREPLAY_MODE: public
      FLOORREPLAY_BUILD_ID: ${FLOORREPLAY_BUILD_ID:-local-compose}
      FLOORREPLAY_OPENAI_API_KEY: ${FLOORREPLAY_OPENAI_API_KEY:-}
      FLOORREPLAY_CORS_ORIGINS: '["http://localhost:${FLOORREPLAY_FRONTEND_PORT:-5174}","http://127.0.0.1:${FLOORREPLAY_FRONTEND_PORT:-5174}"]'
    command: ["sh", "-c", "alembic upgrade head && python -m flooreplay seed && exec uvicorn flooreplay.api:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${FLOORREPLAY_API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    ports:
      - "127.0.0.1:${FLOORREPLAY_FRONTEND_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  test-db:
    profiles: [test]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flooreplay_test
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: flooreplay_release_test
    ports:
      - "127.0.0.1:${FLOORREPLAY_TEST_DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flooreplay_test -d flooreplay_release_test"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  flooreplay-release-pg:
